<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>
    <h1>Search Results</h1>

    <!-- Form pencarian tetap ditampilkan agar user bisa refine pencarian -->
    <form method="get" action="{% url 'search_result' %}">
        {{ form.as_p }}
        <button type="submit">Search</button>
    </form>

    <ul>
      {% for movie in movies %}
        <li>{{ movie.title }} ({{ movie.release_year }})</li>
      {% empty %}
        <li>No movies found.</li>
      {% endfor %}
    </ul>

    <a href="{% url 'home' %}">Back to Home</a>
    <a href="{% url 'movie_list' %}">Back to Movie List</a>
</body>
</html>
